<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>podcast-postline</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #f7f4ef;
        color: #1c2420;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      main {
        width: min(720px, calc(100% - 32px));
      }
      h1 {
        font-size: clamp(2.25rem, 7vw, 5rem);
        line-height: 0.95;
        margin: 0 0 1rem;
      }
      p {
        font-size: 1.125rem;
        line-height: 1.65;
      }
      a {
        color: #006d77;
        font-weight: 700;
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-top: 2rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>podcast-postline</h1>
      <p>
        GitHub Pages frontend plus Docker audio pipeline for denoise,
        -16 LUFS normalization, silence trimming, and podcast export.
      </p>
      <div class="links">
        <a href="https://github.com/baditaflorin/podcast-postline">Star on GitHub</a>
        <a href="https://www.paypal.com/paypalme/florinbadita">Support via PayPal</a>
      </div>
    </main>
  </body>
</html>
