events {}

http {
  limit_req_zone $binary_remote_addr zone=api:10m rate=10r/m;

  gzip on;
  gzip_types text/plain application/json application/javascript text/css application/xml;

  server {
    listen 80;
    server_name _;
    return 301 https://$host:25342$request_uri;
  }

  server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 800m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; connect-src 'self' https://baditaflorin.github.io; frame-ancestors 'none'" always;

    location /metrics {
      return 403;
    }

    location /api/ {
      limit_req zone=api burst=5 nodelay;

      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "https://baditaflorin.github.io" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
        add_header Access-Control-Max-Age 43200 always;
        return 204;
      }

      add_header Access-Control-Allow-Origin "https://baditaflorin.github.io" always;
      add_header Access-Control-Expose-Headers "Content-Disposition, X-Postline-Version" always;

      proxy_pass http://app:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 1800s;
      proxy_send_timeout 1800s;
    }

    location / {
      proxy_pass http://app:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}

